<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    font-family:"Open Sans",sans-serif;
    background:#ffd6e7;
}

/* ================= PAGE 1 ================= */

#page1{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;
    background:#ffd6e7;
}

/* canvas */

canvas{
    position:fixed;
    top:0;
    left:0;
    z-index:1;
}

/* TEXT */

#text{

    position:absolute;

    left:50%;
    top:28%;

    transform:translateX(-50%);

    font-size:70px;
    font-weight:700;

    color:#ff2d75;

    white-space:nowrap;

    overflow:hidden;

    width:0;

    z-index:20;

    text-shadow:
    0 0 10px #ff2d75,
    0 0 20px #ff2d75,
    0 0 40px #ff5fa2;

    border-right:4px solid #ff2d75;

    animation:
    typing 8s steps(130,end) forwards,
    blinkCursor .7s infinite;

    animation-delay:5s;
}

@keyframes typing{

    from{
        width:0;
    }

    to{
        width:130ch;
    }
}

@keyframes blinkCursor{

    50%{
        border-color:transparent;
    }
}

/* ================= GIRL ================= */

#girl{

    position:absolute;

    left:-200px;
    bottom:40px;

    width:220px;
    height:380px;

    z-index:999;

    animation:
    moveGirl 3.5s ease forwards;
}

@keyframes moveGirl{

    from{
        left:-200px;
    }

    to{
        left:calc(50% - 110px);
    }
}

/* head */

.head{

    width:90px;
    height:90px;

    background:#ffe0bd;

    border-radius:50%;

    margin:auto;

    position:relative;

    border:4px solid #222;
}

/* hair */

.hair{

    position:absolute;

    width:100px;
    height:100px;

    background:#222;

    border-radius:50%;

    top:-10px;
    left:-5px;

    z-index:-1;
}

/* eyes */

.eye{

    position:absolute;

    width:10px;
    height:10px;

    background:#222;

    border-radius:50%;

    top:38px;
}

.eye.left{
    left:22px;
}

.eye.right{
    right:22px;
}

/* smile */

.mouth{

    position:absolute;

    width:30px;
    height:15px;

    border-bottom:4px solid #ff4f81;

    border-radius:0 0 20px 20px;

    left:50%;
    transform:translateX(-50%);

    bottom:18px;
}

/* body */

.bodyGirl{

    width:80px;
    height:120px;

    background:#ff4f81;

    margin:10px auto;

    border-radius:20px;
}

/* arms */

.arms{

    position:absolute;

    top:110px;
    left:50%;

    transform:translateX(-50%);

    width:220px;
    height:100px;
}

.arm{

    position:absolute;

    width:90px;
    height:18px;

    background:#ffe0bd;

    border-radius:20px;
}

/* left arm */

.arm-left{

    left:0;

    transform:
    rotate(25deg);

    transform-origin:right center;

    animation:
    leftArm 1s forwards;

    animation-delay:3.5s;
}

/* right arm */

.arm-right{

    right:0;

    transform:
    rotate(-25deg);

    transform-origin:left center;

    animation:
    rightArm 1s forwards;

    animation-delay:3.5s;
}

@keyframes leftArm{

    to{
        transform:
        rotate(-35deg)
        translateY(-15px);
    }
}

@keyframes rightArm{

    to{
        transform:
        rotate(35deg)
        translateY(-15px);
    }
}

/* legs */

.legs{

    display:flex;

    justify-content:center;

    gap:25px;
}

.leg{

    width:18px;
    height:90px;

    background:#ffe0bd;

    border-radius:20px;
}

/* stars */

.star{

    position:absolute;

    width:5px;
    height:5px;

    border-radius:50%;

    background:white;

    animation:blink 2s infinite;
}

@keyframes blink{

    50%{
        opacity:.2;
    }
}

body.play-music{
    animation:glow 2s infinite alternate;
}

@keyframes glow{
    from{
        background:#ffd6e7;
    }
    to{
        background:#ffc1da;
    }
}

@media(max-width:768px){

    #text{
        font-size:32px;
        top:20%;
    }

    #girl{
        transform:scale(.8);
    }
}

</style>
</head>

<body>

<!-- PAGE 1 -->

<div id="page1">

    <div id="girl">

        <div class="head">

            <div class="hair"></div>

            <div class="eye left"></div>
            <div class="eye right"></div>

            <div class="mouth"></div>

        </div>

        <div class="arms">

            <div class="arm arm-left"></div>
            <div class="arm arm-right"></div>

        </div>

        <div class="bodyGirl"></div>

        <div class="legs">

            <div class="leg"></div>
            <div class="leg"></div>

        </div>

    </div>

    <div id="text">
        HAPPY BIRTHDAY BChau nhaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    </div>

    <canvas id="canvas"></canvas>

</div>

<script>

/* ================= MUSIC ================= */

const audio = document.createElement("audio");

audio.src =
"https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3?filename=happy-birthday-to-you-piano-version-13976.mp3";

audio.loop = true;
audio.autoplay = true;
audio.volume = 1;

document.body.appendChild(audio);

/* FORCE PLAY */

function playMusic(){

    audio.play()
    .then(() => {

        console.log("Nhạc đang phát");

        document.body.classList.add("play-music");

    })
    .catch((err) => {

        console.log("Autoplay bị chặn", err);

    });
}

/* chạy ngay khi mở */

window.addEventListener("load", () => {

    playMusic();

});

/* chrome chặn thì chỉ cần đụng chuột là phát */

document.body.addEventListener(
    "mousemove",
    playMusic,
    { once:true }
);

document.body.addEventListener(
    "click",
    playMusic,
    { once:true }
);

document.body.addEventListener(
    "touchstart",
    playMusic,
    { once:true }
);

/* ================= CANVAS ================= */

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;

const girl =
document.getElementById("girl");

const particles = [];

function createParticle(x,y){

    particles.push({

        x,
        y,

        size:
        Math.random()*4+2,

        speedX:
        (Math.random()-.5)*2,

        speedY:
        (Math.random()-.5)*2,

        alpha:1
    });
}

function drawParticles(){

    for(let i=0;i<particles.length;i++){

        const p =
        particles[i];

        ctx.beginPath();

        ctx.fillStyle =
        `rgba(255,50,150,${p.alpha})`;

        ctx.shadowBlur = 20;

        ctx.shadowColor =
        "#ff2d75";

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();

        p.x += p.speedX;

        p.y += p.speedY;

        p.alpha -= 0.015;

        if(p.alpha <= 0){

            particles.splice(i,1);

            i--;
        }
    }
}

let t = 0;

function animate(){

    requestAnimationFrame(animate);

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawParticles();

    if(t > 220 && t < 340){

        const rect =
        girl.getBoundingClientRect();

        const x =
        rect.left +
        rect.width/2;

        const y =
        rect.top + 120;

        for(let i=0;i<5;i++){

            createParticle(
                x + (Math.random()-0.5)*40,
                y + (Math.random()-0.5)*20
            );
        }
    }

    t++;
}

animate();

/* ================= STARS ================= */

for(let i=0;i<80;i++){

    const star =
    document.createElement("div");

    star.classList.add("star");

    star.style.left =
    Math.random()*100+"vw";

    star.style.top =
    Math.random()*100+"vh";

    star.style.animationDuration =
    Math.random()*3+1+"s";

    document.getElementById("page1")
    .appendChild(star);
}

/* resize */

window.addEventListener("resize",()=>{

    canvas.width =
    window.innerWidth;

    canvas.height =
    window.innerHeight;
});

</script>

</body>
</html>
